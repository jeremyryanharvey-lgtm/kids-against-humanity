
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KAM - Card Statistics</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #151515;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 1100px;
      margin: auto;
    }

    h1 { margin-bottom: 6px; }

    .muted { color: #aaa; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 24px 0;
    }

    input, select {
      padding: 12px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #252525;
      color: white;
      font-size: 15px;
    }

    input { flex: 1; min-width: 180px; }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .stat {
      background: #252525;
      padding: 16px;
      border-radius: 8px;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      margin-top: 6px;
    }

    .table-wrap {
      overflow-x: auto;
      background: #202020;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th, td {
      padding: 13px;
      text-align: left;
      border-bottom: 1px solid #383838;
    }

    th {
      background: #303030;
      position: sticky;
      top: 0;
    }

    th button {
      background: none;
      border: 0;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    td.number { text-align: center; }

    .message {
      padding: 20px 0;
      color: #ccc;
    }

    button.refresh {
      padding: 12px 18px;
      background: #e4b94d;
      color: #171717;
      border: 0;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
<main>
  <h1>Card Statistics</h1>
  <div class="muted">Kids Against Maturity · Private admin dashboard</div>

  <div class="summary">
    <div class="stat">Cards tracked<strong id="totalCards">0</strong></div>
    <div class="stat">Times drawn<strong id="totalDrawn">0</strong></div>
    <div class="stat">Times submitted<strong id="totalSubmitted">0</strong></div>
    <div class="stat">Times selected<strong id="totalSelected">0</strong></div>
  </div>

  <div class="controls">
    <input id="search" type="search" placeholder="Search answer cards...">

    <select id="sort">
      <option value="selected">Most selected</option>
      <option value="leastSelected">Least selected</option>
      <option value="drawn">Most drawn</option>
      <option value="leastDrawn">Least drawn</option>
      <option value="submitted">Most submitted</option>
      <option value="rate">Highest selection rate</option>
      <option value="lowestRate">Lowest selection rate</option>
      <option value="alphabetical">Alphabetical</option>
    </select>

    <button class="refresh" onclick="loadStats()">Refresh</button>
  </div>

  <div id="message" class="message">Loading statistics...</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Answer card</th>
          <th>Drawn</th>
          <th>Submitted</th>
          <th>Selected</th>
          <th>Selection rate</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
  </div>
</main>

<script>
let cards = [];

async function loadStats() {
  const message = document.getElementById("message");
  message.textContent = "Loading statistics...";

  try {
    const response = await fetch("/api/stats");

    if (!response.ok) {
      throw new Error("Could not load statistics.");
    }

    const data = await response.json();
    cards = data.cards || [];

    document.getElementById("totalCards").textContent = cards.length;
    document.getElementById("totalDrawn").textContent =
      cards.reduce((sum, card) => sum + (card.drawn || 0), 0);
    document.getElementById("totalSubmitted").textContent =
      cards.reduce((sum, card) => sum + (card.submitted || 0), 0);
    document.getElementById("totalSelected").textContent =
      cards.reduce((sum, card) => sum + (card.selected || 0), 0);

    message.textContent = cards.length
      ? "Statistics loaded."
      : "No statistics recorded yet.";

    render();
  } catch (error) {
    message.textContent = error.message;
  }
}

function render() {
  const search = document.getElementById("search").value.toLowerCase();
  const sort = document.getElementById("sort").value;

  let filtered = cards.filter(card =>
    (card.text || "").toLowerCase().includes(search) ||
    String(card.cardId || "").toLowerCase().includes(search)
  );

  const rate = card => card.submitted
    ? card.selected / card.submitted
    : 0;

  const sorters = {
    selected: (a, b) => b.selected - a.selected,
    leastSelected: (a, b) => a.selected - b.selected,
    drawn: (a, b) => b.drawn - a.drawn,
    leastDrawn: (a, b) => a.drawn - b.drawn,
    submitted: (a, b) => b.submitted - a.submitted,
    rate: (a, b) => rate(b) - rate(a),
    lowestRate: (a, b) => rate(a) - rate(b),
    alphabetical: (a, b) => (a.text || "").localeCompare(b.text || "")
  };

  filtered.sort(sorters[sort]);

  const tbody = document.getElementById("results");
  tbody.replaceChildren();

  filtered.forEach(card => {
    const tr = document.createElement("tr");
    const values = [
      card.text || "",
      card.drawn || 0,
      card.submitted || 0,
      card.selected || 0,
      (rate(card) * 100).toFixed(1) + "%"
    ];

    values.forEach((value, index) => {
      const td = document.createElement("td");
      td.textContent = value;
      if (index > 0) td.className = "number";
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  if (!filtered.length) {
    document.getElementById("message").textContent =
      "No matching cards found.";
  } else {
    document.getElementById("message").textContent =
      "Showing " + filtered.length + " cards.";
  }
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);

loadStats();
</script>
</body>
</html>
